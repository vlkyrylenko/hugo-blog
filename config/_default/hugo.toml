baseURL = "https://blog.kyrylenko.ca/"
languageCode = "en"
title = "Vlad Kyrylenko - Blog"
theme = "blowfish"

[deployment]
[[deployment.targets]]
  name = "S3"
  URL = "s3://blog-hugo-s3-content?region=ca-central-1"
  cloudFrontDistributionID = "E332144DPTLSWB"

# Hugo-generated assets are content-hashed — safe to cache forever.
[[deployment.matchers]]
  pattern = '^/(css|js)/.+\.(css|js)$'
  cacheControl = "max-age=31536000, no-transform, public"

[taxonomies]
  topics = "topics"
